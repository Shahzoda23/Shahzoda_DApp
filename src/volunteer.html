<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Application - Happy Tails</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="volunteer-page">
  <div class="volunteer-form-container">
    <h1>Volunteer Application Form</h1>
    <form id="volunteerForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required placeholder="Enter your address">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth (18+ required)</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <div class="form-group">
        <label for="about">Why would you like to volunteer?</label>
        <textarea id="about" name="about" required placeholder="Tell us why..."></textarea>
      </div>

      <div class="form-group">
        <label for="experience">Any relevant experience?</label>
        <textarea id="experience" name="experience" required placeholder="Your experience..."></textarea>
      </div>

      <div class="form-group">
        <label for="availability">Which days are you available weekly?</label>
        <textarea id="availability" name="availability" required placeholder="e.g., Mondays and Thursdays"></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit the Form</button>
    </form>

    <div id="thankYouMessage" style="display: none; margin-top: 20px; font-weight: bold;">
      Thank you for applying to be a volunteer! We will email you further details and let you know whether you are selected.
    </div>
    <a href="index.html" class="back-home-btn" id="backHomeButton" style="display: none;">← Back to Home</a>
  </div>

  <script>
    document.getElementById('volunteerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('volunteerForm').style.display = 'none';
      document.getElementById('thankYouMessage').style.display = 'block';
      document.getElementById('backHomeButton').style.display = 'inline-block'; 
    });
  </script>
</body>
</html>
